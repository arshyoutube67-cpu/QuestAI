<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuestAI</title>
<style>
:root{--bg:#f3f0ff;--glass:rgba(255,255,255,.72);--card:#fff;--text:#1a1830;--muted:#67658a;--p:#6d4aff;--c:#00b8d9;--pk:#ff5ccf;--ai:#fff;--bd:rgba(109,74,255,.2);--sh:0 10px 34px rgba(80,60,200,.14);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0a1d;--glass:rgba(28,24,58,.66);--card:#1c1838;--text:#f2f0ff;--muted:#a29fc8;--p:#8b6dff;--c:#22d3ee;--pk:#ff6bd6;--ai:#221d46;--bd:rgba(139,109,255,.3);--sh:0 10px 34px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0a1d;--glass:rgba(28,24,58,.66);--card:#1c1838;--text:#f2f0ff;--muted:#a29fc8;--p:#8b6dff;--c:#22d3ee;--pk:#ff6bd6;--ai:#221d46;--bd:rgba(139,109,255,.3);--sh:0 10px 34px rgba(0,0,0,.45);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body::before,body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.38;z-index:0;pointer-events:none;animation:drift 22s ease-in-out infinite alternate}
body::before{background:var(--p);top:-25vmax;left:-20vmax}
body::after{background:var(--c);bottom:-28vmax;right:-22vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#app{position:relative;z-index:1;height:100%;max-width:860px;margin:0 auto;display:flex;flex-direction:column}
.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);box-shadow:var(--sh)}
header{position:relative;display:flex;align-items:center;gap:11px;padding:10px 14px;margin:32px 12px 0;border-radius:20px}
.orb{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:20px;background:conic-gradient(from 200deg,var(--p),var(--c),var(--pk),var(--p));box-shadow:0 0 20px color-mix(in srgb,var(--p) 60%,transparent);animation:spin 8s linear infinite}
.orb i{font-style:normal;animation:spin 8s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.tt{flex:1;min-width:0}
.tt h1{margin:0;font-size:21px;letter-spacing:-.4px;line-height:1.2;background:linear-gradient(90deg,var(--p),var(--c),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.xp{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.xp b{color:var(--text)}
.bar0{flex:1;max-width:120px;height:6px;border-radius:9px;background:var(--bd);overflow:hidden}
.bar0 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--pk));transition:width .5s}
.ib{border:1px solid var(--bd);background:var(--card);color:var(--text);width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:16px;flex:none}
.ib:hover{border-color:var(--p)}
#log{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.hero{text-align:center;padding:14px 2px 4px}
.hero .orb{width:80px;height:80px;font-size:38px;margin:0 auto 12px}
.hero h2{margin:0 0 2px;font-size:36px;letter-spacing:-1px;line-height:1.15}
.hero p{margin:0 auto 18px;color:var(--muted);max-width:440px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;text-align:left}
.gc{border:1px solid var(--bd);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);border-radius:18px;padding:14px;cursor:pointer;font:inherit;transition:transform .18s,border-color .18s,box-shadow .18s}
.gc:hover{transform:translateY(-4px);border-color:var(--p);box-shadow:0 12px 28px color-mix(in srgb,var(--p) 30%,transparent)}
.gc .e{font-size:28px;display:block;margin-bottom:6px}
.gc b{display:block;font-size:15px}
.gc small{color:var(--muted);font-size:12.5px;line-height:1.3;display:block;margin-top:2px}
.row{display:flex;gap:9px;align-items:flex-end;animation:pop .28s ease-out}
.row.u{flex-direction:row-reverse}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;background:linear-gradient(135deg,var(--p),var(--c))}
.col{max-width:84%;min-width:0}
.m{padding:10px 15px;border-radius:20px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.a .m{background:var(--ai);border:1px solid var(--bd);border-bottom-left-radius:6px}
.u .m{background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 50%,var(--c)));color:#fff;border-bottom-right-radius:6px;box-shadow:0 6px 20px color-mix(in srgb,var(--p) 35%,transparent)}
.m pre{white-space:pre;overflow-x:auto;background:rgba(0,0,0,.28);color:#e8e6ff;border-radius:12px;padding:10px 12px;margin:6px 0;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
.m code{background:rgba(127,110,255,.2);padding:1px 6px;border-radius:6px;font:.9em ui-monospace,Menlo,Consolas,monospace}
.m img{max-width:100%;border-radius:12px;display:block;margin-bottom:6px}
.act{display:flex;gap:6px;margin:4px 0 0 4px}
.act button{border:0;background:transparent;color:var(--muted);font-size:12.5px;cursor:pointer;padding:3px 8px;border-radius:8px}
.act button:hover{background:var(--bd);color:var(--text)}
.typing{display:inline-flex;gap:5px;padding:5px 0}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:b 1.1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}
.tools{padding:4px 14px 0;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--bd);background:var(--glass);color:var(--text);border-radius:999px;padding:5px 13px;font:inherit;font-size:13.5px;cursor:pointer}
.chips button.on{background:linear-gradient(135deg,var(--p),var(--c));color:#fff;border-color:transparent}
.pw{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--p);color:#fff}
#prev{display:none;align-items:center;gap:6px}
#prev img{height:30px;border-radius:7px}
#prev button{border:0;background:var(--bd);color:var(--text);border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:11px}
#bar{display:flex;gap:8px;align-items:flex-end;margin:6px 12px 12px;padding:7px;border-radius:28px}
#inp{flex:1;border:0;background:transparent;color:var(--text);font:inherit;resize:none;outline:none;padding:9px 6px;max-height:130px}
#send,#att{width:42px;height:42px;border:0;border-radius:50%;cursor:pointer;font-size:18px;flex:none}
#att{background:var(--card);color:var(--text);border:1px solid var(--bd);display:none}
#send{color:#fff;background:linear-gradient(135deg,var(--p),var(--c),var(--pk));background-size:160% 160%;transition:transform .15s}
#send:hover:not(:disabled){transform:scale(1.09)}
#send:disabled{opacity:.45;cursor:default}
#mic,#speak{width:42px;height:42px;border:1px solid var(--bd);border-radius:50%;background:var(--card);color:var(--text);cursor:pointer;font-size:17px;flex:none}
#mic.listening{background:#ef4444;color:#fff}
.act button.vote{font-size:16px;padding:3px 7px}
.act button.vote.selected{background:var(--bd);color:var(--p)}
.voice-note{font-size:11px;color:var(--muted);padding:0 6px}
#modal{position:fixed;inset:0;z-index:5;background:rgba(5,3,20,.6);display:none;place-items:center;padding:16px}
#modal.show{display:grid}
.panel{width:min(340px,100%);border-radius:24px;padding:20px;text-align:center;background:var(--card);border:1px solid var(--bd)}
.panel h3{margin:0 0 4px}
#st{color:var(--muted);min-height:24px;margin-bottom:10px}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
#board button{aspect-ratio:1;border:1px solid var(--bd);border-radius:16px;background:var(--bg);color:var(--text);font-size:38px;font-weight:700;cursor:pointer}
#board button:hover:not(:disabled){border-color:var(--p)}
.x{color:var(--c)}.o{color:var(--pk)}
.panel .btns{display:flex;gap:8px;justify-content:center}
.panel .btns button{border:1px solid var(--bd);background:var(--bg);color:var(--text);border-radius:12px;padding:8px 16px;font:inherit;cursor:pointer}
.mas{position:absolute;top:-30px;width:44px;height:44px;z-index:3;pointer-events:none;animation:flt 3.6s ease-in-out infinite;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.mas.l{left:12px}.mas.r{right:12px;animation-delay:-1.8s}
@keyframes flt{50%{transform:translateY(-6px)}}
.hv{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:10px}
.hv .orb{margin:0!important;width:88px;height:88px;position:relative}
.hv .orb::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--p);opacity:.5;animation:ring 2.4s ease-out infinite}
@keyframes ring{to{transform:scale(1.35);opacity:0}}
.hm{width:60px;height:60px;animation:flt 3.2s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.hm+.orb+.hm{animation-delay:-1.6s}
.shim{background:linear-gradient(90deg,var(--p),var(--c),var(--pk),var(--p));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:250% 0}}
.wave{display:inline-block;transform-origin:70% 70%;animation:wv 2.2s ease-in-out infinite}
@keyframes wv{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}}
.tag{display:inline-block;margin:6px 0 10px;padding:4px 14px;border-radius:999px;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--p),var(--c))}
.cb{margin:6px 0;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.32)}
.ch{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;background:rgba(255,255,255,.09);font-size:12px;color:#cfcaff}
.ch span{flex:1;text-transform:uppercase;letter-spacing:.5px}
.ch button{border:0;border-radius:8px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;background:rgba(255,255,255,.16);color:#fff}
.ch button.play{background:linear-gradient(135deg,var(--p),var(--c));font-weight:700}
.cb pre{margin:0!important;border-radius:0!important;background:transparent!important}
#pv{position:fixed;inset:0;z-index:6;background:rgba(5,3,20,.72);display:none;padding:10px}
#pv.show{display:flex}
.pvp{margin:auto;width:min(980px,100%);height:100%;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:var(--card);border:1px solid var(--bd)}
.pvh{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd)}
.pvh span{flex:1}
.pvh button{border:1px solid var(--bd);background:var(--bg);color:var(--text);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
#pvf{flex:1;border:0;background:#fff;width:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <header class="glass">
    <svg class="mas l" viewBox="0 0 64 64" aria-hidden="true"><use href="#mas"/></svg><svg class="mas r" viewBox="0 0 64 64" aria-hidden="true"><use href="#mas" transform="translate(64 0) scale(-1 1)"/></svg>
    <div class="orb"><i>✨</i></div>
    <div class="tt"><h1>QuestAI</h1><div class="xp">Lv <b id="lv">1</b><span class="bar0"><i id="xb"></i></span><span id="xt">0 XP</span></div></div>
    <button class="ib" id="theme" title="Theme" aria-label="Switch theme">🌓</button>
    <button class="ib" id="reset" title="New chat" aria-label="New chat">↺</button>
  </header>
  <div id="log"></div>
  <div class="tools"><div class="voice-note">Chats are saved on this device in this browser.</div>
    <div class="chips" id="modes"></div>
    <div class="pw"><span>Power</span><span class="seg" id="pow"></span><span id="prev"><img id="pimg" alt=""><button id="prm" aria-label="Remove image">✕</button></span></div>
  </div>
  <div id="bar" class="glass"><button id="att" aria-label="Attach image">📎</button><button id="mic" aria-label="Speak to text" title="Speak to text">🎙️</button><textarea id="inp" rows="1" placeholder="Ask QuestAI anything…"></textarea><button id="speak" aria-label="Read latest answer aloud" title="Read latest answer aloud">🔊</button><button id="send" aria-label="Send">➤</button></div><div class="voice-note">🎙️ Speak to type · 🔊 Read the latest AI answer aloud</div>
</div>
<div id="pv"><div class="pvp"><div class="pvh"><b>▶ Live preview</b><span></span><button id="pvr">↻ Restart</button><button id="pvc">📋 Copy code</button><button id="pvx">✕ Close</button></div><iframe id="pvf" sandbox="allow-scripts allow-modals allow-pointer-lock" title="Preview"></iframe></div></div>
<input type="file" id="file" accept="image/*" hidden>
<div id="modal"><div class="panel"><h3>⭕ Tic-tac-toe</h3><div id="st"></div><div id="board"></div><div class="btns"><button id="again">Play again</button><button id="close">Close</button></div></div></div>
<script>
const $ = id => document.getElementById(id);
const BASE = "You are QuestAI, a super smart, friendly, funny AI buddy with a big personality. Answer any question clearly and accurately, explain things simply with examples, and chat with warmth, humour and a little slang. Use **bold** for key words, short paragraphs, and emoji sparingly. Use triple-backtick code blocks for code. Keep answers concise unless asked for detail. You cannot browse the internet and have no live data, so for news, prices, scores, weather or anything recent, say so briefly, give what you know, and suggest where to check. Never invent facts or sources; if unsure, say so. If asked your name, you are QuestAI. When asked to make a game, app, animation or web page, give a very short intro and then ONE complete, self-contained HTML file in a single ```html code block with inline CSS and JS, no external files, links or libraries, mobile-friendly with touch and keyboard controls, so the person can press Play and run it instantly.";
const MODES = {
  chat:["💬 Chat","Be a fun, helpful all-round buddy."],
  game:["🎮 Games","Be an energetic game master. Run trivia, 20 questions, riddles, word games, would-you-rather, guess-the-number, emoji quizzes. Keep score, stay playful, one round at a time, short replies."],
  study:["📚 Study","Be a patient study coach. Explain step by step with simple examples, quiz the person, and when given a syllabus and exam date build a day-by-day plan with short sessions, revision and breaks."],
  code:["💻 Code","Be an expert programmer and teacher. Write clean working code, explain it simply for beginners, find bugs, and give next steps."],
  write:["✍️ Create","Be a creative writer: stories, poems, raps, speeches, captions, names and ideas. Be vivid, original and fun."]
};
const POW = [["⚡ Fast","quick"],["🧠 Smart","default"],["🔮 Genius","complex"]];
const CARDS = [
  ["🧠","Trivia","Test your brain","game","Let’s play trivia! One question at a time, keep score, and make it harder as I get them right."],
  ["❓","20 Questions","I guess or you guess","game","Let’s play 20 Questions. Ask whether I want to guess your thing or you guess mine, then start."],
  ["🧩","Riddles","Brain teasers","game","Give me a riddle, one at a time, with hints only if I ask."],
  ["📖","Story quest","Choose your path","write","Start an interactive adventure story where I choose what happens next. Ask me for a theme first."],
  ["📚","Study planner","Syllabus to plan","study","Help me make a study plan. Ask for my subjects or syllabus topics and my exam date, then build a day-by-day plan."],
  ["⭕","Tic-tac-toe","Beat the bot","ttt",""]
];
let S = {h:[], xp:0};
try{ Object.assign(S, JSON.parse(localStorage.getItem("questai") || "{}")); }catch(e){}
if(!Array.isArray(S.h)) S.h = [];
const save = () => { try{ localStorage.setItem("questai", JSON.stringify({h:S.h.slice(-40), xp:S.xp})); }catch(e){} };
let sample = null, caps = null, busy = false, ctl = null, mode = "chat", tier = "quick", img = null;
const log = $("log"), inp = $("inp"), send = $("send");

function xp(n){
  S.xp += n; const lv = Math.floor(S.xp/100)+1;
  $("lv").textContent = lv; $("xb").style.width = (S.xp%100)+"%"; $("xt").textContent = S.xp+" XP"; save();
}
function inline(el, s){
  s.split(/(\*\*[^*\n]+\*\*|`[^`\n]+`|^#{1,3} .+$)/m).forEach(p => {
    if(!p) return;
    let n;
    if(/^\*\*[^*]+\*\*$/.test(p)){ n = document.createElement("strong"); n.textContent = p.slice(2,-2); }
    else if(/^`[^`]+`$/.test(p)){ n = document.createElement("code"); n.textContent = p.slice(1,-1); }
    else if(/^#{1,3} /.test(p)){ n = document.createElement("strong"); n.textContent = p.replace(/^#+ /,""); }
    else n = document.createTextNode(p);
    el.appendChild(n);
  });
}
function copy(t, btn, label){
  const ok = () => { btn.textContent = "✅ Copied"; setTimeout(() => btn.textContent = label, 1500); };
  const fb = () => { const a = document.createElement("textarea"); a.value = t; a.style.position = "fixed"; a.style.opacity = "0"; document.body.appendChild(a); a.select(); try{ document.execCommand("copy"); ok(); }catch(e){} a.remove(); };
  try{ navigator.clipboard.writeText(t).then(ok).catch(fb); }catch(e){ fb(); }
}
const isWeb = (l, c) => l === "html" || (!l && /<(!doctype|html|body|canvas|script)/i.test(c));
function fmt(el, t){
  el.textContent = "";
  const parts = t.split("```");
  parts.forEach((seg,i) => {
    if(i%2){
      const nl = seg.indexOf("\n"), lang = (nl > -1 ? seg.slice(0,nl) : "").trim().toLowerCase();
      const code = (nl > -1 ? seg.slice(nl+1) : seg).replace(/\n$/,"");
      const box = document.createElement("div"); box.className = "cb";
      const hd = document.createElement("div"); hd.className = "ch";
      const lb = document.createElement("span"); lb.textContent = lang || "code"; hd.appendChild(lb);
      if(i < parts.length-1){
        if(isWeb(lang, code)){ const pl = document.createElement("button"); pl.className = "play"; pl.textContent = "▶ Play"; pl.onclick = () => openPrev(code); hd.appendChild(pl); }
        const cp = document.createElement("button"); cp.textContent = "📋 Copy"; cp.onclick = () => copy(code, cp, "📋 Copy"); hd.appendChild(cp);
      }
      const pre = document.createElement("pre"); pre.textContent = code;
      box.appendChild(hd); box.appendChild(pre); el.appendChild(box);
    } else inline(el, seg);
  });
}
function row(cls, text, imgUrl){
  const r = document.createElement("div"); r.className = "row " + cls;
  if(cls === "a"){ const a = document.createElement("div"); a.className = "av"; a.textContent = "✨"; r.appendChild(a); }
  const c = document.createElement("div"); c.className = "col"; r.appendChild(c);
  const m = document.createElement("div"); m.className = "m"; c.appendChild(m);
  if(imgUrl){ const i = document.createElement("img"); i.src = imgUrl; i.alt = "attached image"; m.appendChild(i); }
  if(text){ const s = document.createElement("span"); fmt(s, text); m.appendChild(s); }
  log.appendChild(r); log.scrollTop = log.scrollHeight; return {r, c, m};
}
function acts(o, text, last){
  o.c.querySelectorAll(".act").forEach(x => x.remove());
  const d = document.createElement("div"); d.className = "act";
  const cp = document.createElement("button"); cp.textContent = "📋 Copy all";
  cp.onclick = () => copy(text, cp, "📋 Copy all");
  d.appendChild(cp);
  const up = document.createElement("button"); up.className = "vote"; up.textContent = "👍"; up.title = "Good answer"; up.setAttribute("aria-label","Good answer");
  const down = document.createElement("button"); down.className = "vote"; down.textContent = "👎"; down.title = "Bad answer"; down.setAttribute("aria-label","Bad answer");
  const voteKey = "questai-vote-" + btoa(unescape(encodeURIComponent(text))).slice(0,32);
  const storedVote = localStorage.getItem(voteKey);
  if(storedVote === "up") up.classList.add("selected");
  if(storedVote === "down") down.classList.add("selected");
  const vote = v => { try { localStorage.setItem(voteKey, v); } catch(e) {} up.classList.toggle("selected",v==="up"); down.classList.toggle("selected",v==="down"); };
  up.onclick = () => vote("up"); down.onclick = () => vote("down");
  d.appendChild(up); d.appendChild(down);
  const say = document.createElement("button"); say.textContent = "🔊 Read aloud"; say.onclick = () => speakText(text); d.appendChild(say);
  if(last){ const rg = document.createElement("button"); rg.textContent = "↻ Redo"; rg.onclick = regen; d.appendChild(rg); }
  o.c.appendChild(d);
}
function hero(){
  log.textContent = "";
  const h = document.createElement("div"); h.className = "hero"; h.id = "hero";
  h.innerHTML = '<div class="hv"><div class="orb"><i>✨</i></div></div><h2><span class="wave">👋</span> Hi, I’m <span class="shim">QuestAI</span></h2><div class="tag">Your fast, funny, game-making AI</div><p>Ask me anything, solve homework, write code, or ask for a game and play it right here. Earn XP as you go!</p><div class="grid"></div>';
  CARDS.forEach(([e,t,s,md,p]) => {
    const b = document.createElement("button"); b.className = "gc";
    b.innerHTML = '<span class="e"></span><b></b><small></small>';
    b.children[0].textContent = e; b.children[1].textContent = t; b.children[2].textContent = s;
    b.onclick = () => { if(md === "ttt") return openTTT(); setMode(md); ask(p); };
    h.querySelector(".grid").appendChild(b);
  });
  log.appendChild(h);
}
function restore(){
  if(!S.h.length) return hero();
  log.textContent = "";
  S.h.forEach(m => { const o = row(m.role === "user" ? "u" : "a", m.content); });
  const last = log.querySelector(".row.a:last-child .col");
  if(last && S.h[S.h.length-1].role === "assistant") acts({c:last}, S.h[S.h.length-1].content, true);
}
function setMode(k){ mode = k; document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("on", b.dataset.k === k)); }
Object.entries(MODES).forEach(([k,[l]]) => { const b = document.createElement("button"); b.textContent = l; b.dataset.k = k; b.onclick = () => setMode(k); $("modes").appendChild(b); });
setMode("chat");
POW.forEach(([l,t]) => { const b = document.createElement("button"); b.textContent = l; b.dataset.t = t; b.onclick = () => { tier = t; document.querySelectorAll("#pow button").forEach(x => x.classList.toggle("on", x.dataset.t === t)); }; if(t === tier) b.classList.add("on"); $("pow").appendChild(b); });

claude.use("sample").then(async s => {
  sample = s;
  if(!s){ send.disabled = true; row("a","The AI engine isn’t available in this view. Open this page from claude.ai to chat with me."); return; }
  try{ caps = await s.limits(); if(caps && caps.images){ $("att").style.display = "block"; $("file").accept = caps.images.mediaTypes.join(","); } }catch(e){}
}).catch(() => { send.disabled = true; });

async function run(){
  busy = true; send.textContent = "■"; send.disabled = false;
  ctl = new AbortController();
  const sys = BASE + "\n\nCurrent mode: " + MODES[mode][1] + "\nToday’s date: " + new Date().toDateString() + ".";
  let turns = S.h.slice(-12); while(turns.length && turns[0].role !== "user") turns.shift();
  const msgs = turns.map((m,i) => i === 0 ? {role:"user", content: sys + "\n\nConversation so far begins here:\n" + m.content} : m);
  const o = row("a");
  o.m.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  const lu = (S.h[S.h.length-1] || {}).content || "";
  const mt = tier === "quick" && (mode === "code" || /\b(game|app|website|web page|html|code|program|script)\b/i.test(lu)) ? "default" : tier;
  const opts = {cache:false, modelTier:mt, signal:ctl.signal, onText:({text}) => { if(text){ fmt(o.m, text); log.scrollTop = log.scrollHeight; } }};
  if(img){ opts.images = img; }
  let done = "";
  try{
    const r = await sample(msgs, opts);
    done = r.text; fmt(o.m, done);
    if(r.truncated) done += "\n\n(cut short, ask me to continue)";
    S.h.push({role:"assistant", content:done}); save(); xp(10); acts(o, done, true);
  }catch(e){
    if(e && e.text){ fmt(o.m, e.text); S.h.push({role:"assistant", content:e.text}); save(); acts(o, e.text, true); }
    else{
      const code = e && e.code;
      fmt(o.m, code === "cancelled" ? "Stopped. ✋" : code === "not_granted" ? "I need permission to think. Reload and tap Allow when asked." : code === "rate_limited" ? "Too many messages or your usage limit is reached. Give it a moment and try again." : "Something went wrong. Try again.");
      if(S.h.length && S.h[S.h.length-1].role === "user" && code !== "cancelled") {}
    }
  }
  img = null; $("prev").style.display = "none"; save();
  busy = false; ctl = null; send.textContent = "➤"; send.disabled = !sample; log.scrollTop = log.scrollHeight; inp.focus();
}
async function ask(text){
  text = (text || "").trim();
  if(busy || !sample) return;
  if(!text && img) text = "Look at this image and help me with it.";
  if(!text) return;
  inp.value = ""; inp.style.height = "auto";
  const h = $("hero"); if(h) h.remove();
  row("u", text, img ? URL.createObjectURL(img) : null);
  S.h.push({role:"user", content: (img ? "[The person attached an image] " : "") + text});
  xp(5); save();
  run();
}
function regen(){
  if(busy) return;
  const rows = log.querySelectorAll(".row.a"); if(rows.length) rows[rows.length-1].remove();
  while(S.h.length && S.h[S.h.length-1].role === "assistant") S.h.pop();
  if(S.h.length) run();
}

function speakText(text){
  if(!("speechSynthesis" in window)){ alert("Text-to-speech isn't supported in this browser."); return; }
  window.speechSynthesis.cancel();
  const clean = String(text || "").replace(/```[\s\S]*?```/g, " code omitted ").replace(/[*#`]/g,"");
  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = "en-IN";
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => /en-IN/i.test(v.lang) && /male|boy|man/i.test(v.name)) ||
                   voices.find(v => /en-IN/i.test(v.lang)) ||
                   voices.find(v => /^en/i.test(v.lang) && /male|boy|man/i.test(v.name)) ||
                   voices.find(v => /^en/i.test(v.lang));
  if(preferred) utter.voice = preferred;
  utter.rate = 1; utter.pitch = 0.85;
  window.speechSynthesis.speak(utter);
}
$("speak").onclick = () => {
  const lastAnswer = [...S.h].reverse().find(m => m.role === "assistant");
  if(lastAnswer) speakText(lastAnswer.content);
};
let recognition = null, listening = false;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = "en-IN"; recognition.interimResults = true; recognition.continuous = false;
  recognition.onresult = e => {
    let transcript = "";
    for(let i=e.resultIndex;i<e.results.length;i++) transcript += e.results[i][0].transcript;
    inp.value = transcript; inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight,130)+"px";
  };
  recognition.onend = () => { listening = false; $("mic").classList.remove("listening"); $("mic").textContent = "🎙️"; };
  recognition.onerror = () => { listening = false; $("mic").classList.remove("listening"); $("mic").textContent = "🎙️"; };
  $("mic").onclick = () => {
    if(listening){ recognition.stop(); return; }
    try { recognition.start(); listening = true; $("mic").classList.add("listening"); $("mic").textContent = "⏹️"; }
    catch(e){ alert("Microphone is busy. Try again."); }
  };
}else{
  $("mic").onclick = () => alert("Speech-to-text isn't supported in this browser. Try Chrome or Edge, and allow microphone access.");
}

send.onclick = () => busy ? ctl && ctl.abort() : ask(inp.value);
inp.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); if(!busy) ask(inp.value); } });
inp.addEventListener("input", () => { inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 130) + "px"; });
$("reset").onclick = () => { if(busy) return; S.h = []; save(); hero(); };
$("theme").onclick = () => { const r = document.documentElement, d = matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = (r.dataset.theme || (d ? "dark" : "light")) === "dark" ? "light" : "dark"; };
$("att").onclick = () => $("file").click();
$("file").onchange = e => { const f = e.target.files[0]; if(!f) return; img = f; $("pimg").src = URL.createObjectURL(f); $("prev").style.display = "inline-flex"; e.target.value = ""; };
$("prm").onclick = () => { img = null; $("prev").style.display = "none"; };

/* Tic-tac-toe */
const L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let B = [], over = false;
const win = b => { for(const [a,c,d] of L) if(b[a] && b[a] === b[c] && b[a] === b[d]) return b[a]; return b.every(Boolean) ? "T" : null; };
function mm(b, p){
  const w = win(b); if(w === "O") return {s:1}; if(w === "X") return {s:-1}; if(w === "T") return {s:0};
  let best = {s: p === "O" ? -2 : 2};
  b.forEach((v,i) => { if(!v){ b[i] = p; const r = mm(b, p === "O" ? "X" : "O"); b[i] = null; if(p === "O" ? r.s > best.s : r.s < best.s) best = {s:r.s, m:i}; } });
  return best;
}
function draw(){
  const bd = $("board"); bd.textContent = "";
  B.forEach((v,i) => { const b = document.createElement("button"); b.textContent = v || ""; b.className = v === "X" ? "x" : "o"; b.disabled = !!v || over; b.onclick = () => play(i); bd.appendChild(b); });
}
function play(i){
  B[i] = "X"; let w = win(B);
  if(!w){ const e = B.map((v,k) => v ? -1 : k).filter(k => k >= 0); const m = Math.random() < .25 ? e[Math.floor(Math.random()*e.length)] : mm(B,"O").m; B[m] = "O"; w = win(B); }
  if(w){ over = true; $("st").textContent = w === "X" ? "You win! +30 XP 🎉" : w === "O" ? "I win this time 😎" : "It’s a draw 🤝"; if(w === "X") xp(30); }
  else $("st").textContent = "Your move (you are X)";
  draw();
}
function openTTT(){ B = Array(9).fill(null); over = false; $("st").textContent = "Your move (you are X)"; draw(); $("modal").classList.add("show"); }
$("again").onclick = openTTT; $("close").onclick = () => $("modal").classList.remove("show");
$("modal").onclick = e => { if(e.target.id === "modal") $("modal").classList.remove("show"); };

let pvCode = "";
function loadPrev(){
  const c = /<html|<!doctype/i.test(pvCode) ? pvCode : "<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'></head><body>" + pvCode + "</body></html>";
  $("pvf").srcdoc = ""; setTimeout(() => { $("pvf").srcdoc = c; }, 30);
}
function openPrev(code){ pvCode = code; loadPrev(); $("pv").classList.add("show"); }
$("pvr").onclick = loadPrev;
$("pvc").onclick = () => copy(pvCode, $("pvc"), "📋 Copy code");
$("pvx").onclick = () => { $("pv").classList.remove("show"); $("pvf").srcdoc = ""; };
xp(0); restore();
</script>
